<script>
  // reading progress bar
  const progress = document.getElementById('progress');
  const toTop = document.getElementById('toTop');

  function onScroll() {
    const h = document.documentElement;
    const scrolled = (h.scrollTop) / (h.scrollHeight - h.clientHeight) * 100;
    progress.style.width = scrolled + '%';
    toTop.classList.toggle('show', h.scrollTop > 600);
  }
  document.addEventListener('scroll', onScroll, { passive: true });
  onScroll();

  toTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
  toTop.addEventListener('keydown', e => { if (e.key === 'Enter') window.scrollTo({ top: 0, behavior: 'smooth' }); });

  // scroll reveal
  const revealEls = document.querySelectorAll('.reveal');
  const revealObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('in');
        revealObserver.unobserve(entry.target);
      }
    });
  }, { threshold: 0.15 });
  revealEls.forEach(el => revealObserver.observe(el));

  // timeline jobs stagger + connecting line
  const jobs = document.querySelectorAll('.job');
  const jobObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('in');
        jobObserver.unobserve(entry.target);
      }
    });
  }, { threshold: 0.3 });
  jobs.forEach(el => jobObserver.observe(el));

  const track = document.getElementById('experienceTrack');
  const line = document.getElementById('experienceLine');
  const lineObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        line.style.height = '100%';
        lineObserver.unobserve(entry.target);
      }
    });
  }, { threshold: 0.05 });
  lineObserver.observe(track);

  // animated counters
  const counters = document.querySelectorAll('[data-count]');
  const counterObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      const el = entry.target;
      const target = parseInt(el.dataset.count, 10);
      const suffix = el.dataset.suffix || '';
      const duration = 1200;
      const start = performance.now();
      function tick(now) {
        const p = Math.min((now - start) / duration, 1);
        const eased = 1 - Math.pow(1 - p, 3);
        el.textContent = Math.round(eased * target) + suffix;
        if (p < 1) requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
      counterObserver.unobserve(el);
    });
  }, { threshold: 0.6 });
  counters.forEach(el => counterObserver.observe(el));

  // active nav link on scroll
  const sections = ['impact', 'experience', 'expertise', 'contact']
    .map(id => document.getElementById(id)).filter(Boolean);
  const navLinks = document.querySelectorAll('[data-nav]');
  const navObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      const id = entry.target.id;
      const link = document.querySelector('[data-nav][href="#' + id + '"]');
      if (!link) return;
      if (entry.isIntersecting) {
        navLinks.forEach(l => l.classList.remove('active'));
        link.classList.add('active');
      }
    });
  }, { threshold: 0.4, rootMargin: '-80px 0px -40% 0px' });
  sections.forEach(s => navObserver.observe(s));

  // ---------- floating skill words ----------
  const skillWords = [
    "Stakeholder Management", "Client Success", "Process Improvement",
    "Cross-Functional Leadership", "Technical Deployments", "Vendor Management",
    "Remote Collaboration", "Client Onboarding", "NPS: 10", "Google Workspace",
    "Microsoft 365", "Project Delivery", "Renewals", "Quarterly Roadmaps"
  ];

  function buildFloatingWords() {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const container = document.getElementById('floatingWords');
    if (!container) return;
    const count = window.innerWidth < 700 ? 8 : 14;
    for (let i = 0; i < count; i++) {
      const word = skillWords[Math.floor(Math.random() * skillWords.length)];
      const el = document.createElement('span');
      el.textContent = word;
      const left = (Math.random() * 90 + 3).toFixed(1);
      const duration = 16 + Math.random() * 14;
      const delay = Math.random() * -duration;
      const size = (0.85 + Math.random() * 0.55).toFixed(2);
      const drift = (Math.random() * 60 - 30).toFixed(0) + 'px';
      el.style.left = left + '%';
      el.style.fontSize = size + 'rem';
      el.style.setProperty('--drift', drift);
      el.style.animationDuration = duration + 's';
      el.style.animationDelay = delay + 's';
      container.appendChild(el);
    }
  }
  buildFloatingWords();

  // ---------- chat widget ----------
  const KB = [
    {
      keywords: ["current role", " now", "today", "currently", "interlaced", "what does she do", "job now", "present", "doing now"],
      answer: "Since March 2024, Leila has been a Project Manager at Interlaced.io, leading technical deployment projects for US-based clients — managing 25–30 concurrent projects, leading 40+ onboardings, coordinating a team of 7, and maintaining an NPS score of 10."
    },
    {
      keywords: ["before", "previous", "punto rojo", "tiendanube", "bibam", "almundo", "history", "career path", "past experience", "used to"],
      answer: "Leila has 8+ years of total professional experience. Prior to Interlaced, she was a Client Success Manager at Punto Rojo (2022–2024), Customer Support Specialist at Tiendanube (2020–2022) and Bibam Group (2019–2020), and Travel Consultant at Almundo (2018–2019)."
    },
    {
      keywords: ["skill", "expertise", "tool", "stack", "good at", "strength", "capable"],
      answer: "Her core skills include Project Management & Delivery, Client Onboarding & Implementation, Client Success & Retention, Stakeholder Management, Vendor & Migration Coordination, using tools like Asana, Monday.com, Notion, HubSpot, Intercom, Zendesk, ConnectWise, and Google Workspace."
    },
    {
      keywords: ["remote", "location", "based", "where", "argentina", "timezone", "gmt", "relocate"],
      answer: "Leila is based in Buenos Aires, Argentina (GMT-3), with full overlap with US business hours and daily experience collaborating with English-speaking, distributed teams."
    },
    {
      keywords: ["contact", "email", "reach", "hire her", "linkedin", "connect", "get in touch"],
      answer: "You can reach Leila at leilacenteno@gmail.com, or connect with her on LinkedIn at linkedin.com/in/leilagcenteno."
    },
    {
      keywords: ["why hire", "why should", "value", "strength as pm", "human side", "stand out"],
      answer: "Leila combines project management rigors with deep client success experience: leading technical implementations while keeping an NPS score of 10 and building long-term account trust."
    },
    {
      keywords: ["nps", "satisfaction score"],
      answer: "Leila has maintained an NPS score of 10 across her client portfolio at Interlaced.io over the past year."
    },
    {
      keywords: ["team size", "people manage", "how many people", "manages"],
      answer: "She coordinates a cross-functional delivery team of 7 professionals while managing 25–30 concurrent projects."
    },
    {
      keywords: ["hello", "hi", "hey", "who are you", "who is leila"],
      answer: "Hi! I'm here to answer questions about Leila's experience, skills, and availability — try one of the suggestions below or type your own question."
    }
  ];

  function findAnswer(msg) {
    const text = ' ' + msg.toLowerCase() + ' ';
    let best = null, bestScore = 0;
    KB.forEach(entry => {
      let score = 0;
      entry.keywords.forEach(k => { if (text.includes(k)) score += k.trim().split(' ').length; });
      if (score > bestScore) { bestScore = score; best = entry; }
    });
    return best ? best.answer : "I don't have that specific detail here yet — feel free to email Leila directly at leilacenteno@gmail.com or reach out via LinkedIn!";
  }

  const launcher = document.getElementById('chatLauncher');
  const panel = document.getElementById('chatPanel');
  const closeBtn = document.getElementById('chatClose');
  const chatMessages = document.getElementById('chatMessages');
  const chatForm = document.getElementById('chatForm');
  const chatInput = document.getElementById('chatInput');
  const suggestionsBox = document.getElementById('chatSuggestions');

  const starterQuestions = [
    "What does she do now?",
    "Is she open to remote work?",
    "What are her key skills?",
    "How can I contact her?"
  ];

  let chatOpened = false;

  function addMessage(text, sender) {
    const div = document.createElement('div');
    div.className = 'msg ' + sender;
    div.textContent = text;
    chatMessages.appendChild(div);
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  function showTyping() {
    const div = document.createElement('div');
    div.className = 'msg bot typing';
    div.innerHTML = '<span></span><span></span><span></span>';
    chatMessages.appendChild(div);
    chatMessages.scrollTop = chatMessages.scrollHeight;
    return div;
  }

  function respond(text) {
    addMessage(text, 'user');
    const typingEl = showTyping();
    const delay = 500 + Math.random() * 500;
    setTimeout(() => {
      typingEl.remove();
      addMessage(findAnswer(text), 'bot');
    }, delay);
  }

  function renderSuggestions() {
    suggestionsBox.innerHTML = '';
    starterQuestions.forEach(q => {
      const btn = document.createElement('button');
      btn.className = 'chip';
      btn.type = 'button';
      btn.textContent = q;
      btn.addEventListener('click', () => respond(q));
      suggestionsBox.appendChild(btn);
    });
  }

  function openChat() {
    panel.classList.add('open');
    if (!chatOpened) {
      chatOpened = true;
      addMessage("Hi! I can answer questions about Leila's experience, skills, and availability. Try one of these, or type your own:", 'bot');
      renderSuggestions();
    }
    chatInput.focus();
  }

  function closeChat() {
    panel.classList.remove('open');
  }

  launcher.addEventListener('click', openChat);
  launcher.addEventListener('keydown', e => { if (e.key === 'Enter') openChat(); });
  closeBtn.addEventListener('click', closeChat);

  chatForm.addEventListener('submit', e => {
    e.preventDefault();
    const val = chatInput.value.trim();
    if (!val) return;
    chatInput.value = '';
    respond(val);
  });
</script>
