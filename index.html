<script>
  // ✨ Sparkle / Star Click Sound
  function playClickSound() {
    initAudio();

    const now = audioCtx.currentTime;

    // A few bright notes that create a magical "sparkle" effect
    const sparkleNotes = [
      { freq: 1046.50, delay: 0 },       // C6
      { freq: 1318.51, delay: 0.035 },   // E6
      { freq: 1567.98, delay: 0.07 },    // G6
      { freq: 2093.00, delay: 0.11 }     // C7
    ];

    sparkleNotes.forEach(({ freq, delay }) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';

      osc.frequency.setValueAtTime(freq, now + delay);
      
      // Tiny pitch rise for a magical shimmer
      osc.frequency.exponentialRampToValueAtTime(
        freq * 1.015,
        now + delay + 0.12
      );

      // Very soft beginning → bright sparkle → quick fade
      gain.gain.setValueAtTime(0.0001, now + delay);
      gain.gain.exponentialRampToValueAtTime(
        0.045,
        now + delay + 0.008
      );
      gain.gain.exponentialRampToValueAtTime(
        0.0001,
        now + delay + 0.32
      );

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(now + delay);
      osc.stop(now + delay + 0.35);
    });

    // Extra tiny high-frequency "twinkle"
    const twinkle = audioCtx.createOscillator();
    const twinkleGain = audioCtx.createGain();

    twinkle.type = 'triangle';
    twinkle.frequency.setValueAtTime(2800, now);
    twinkle.frequency.exponentialRampToValueAtTime(4200, now + 0.18);

    twinkleGain.gain.setValueAtTime(0.0001, now);
    twinkleGain.gain.exponentialRampToValueAtTime(0.025, now + 0.015);
    twinkleGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.22);

    twinkle.connect(twinkleGain);
    twinkleGain.connect(audioCtx.destination);

    twinkle.start(now);
    twinkle.stop(now + 0.25);
  }
</script>
